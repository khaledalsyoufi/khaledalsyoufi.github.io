<head>
    <meta charset="UTF-8">

    <meta name="theme-color" content="#F4F2EE" media="(prefers-color-scheme: light)">

    <script>
        // Dark only — matches index.html
        document.documentElement.setAttribute('data-theme', 'dark');
        try { localStorage.removeItem('theme'); } catch (e) { }

    <style>
        .error-page {
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            flex-direction: column;
            padding: 8vw 6vw;
            position: relative;
            z-index: 2;
        }

        .error-badge {
            font-size: 0.85rem;
            letter-spacing: 0.15em;
            margin-bottom: 1rem;
            opacity: 0.85;
        }

        .error-code {
            font-family: var(--display-font);
            font-size: clamp(6.5rem, 24vw, 17rem);
            font-weight: 700;
            line-height: 0.88;
            letter-spacing: -0.04em;
            text-transform: uppercase;
            color: var(--text-color);
            margin: 0;
            user-select: none;
        }

        .error-code .accent {
            color: var(--accent-color);
        }

        .error-desc {
            font-family: var(--sans-font);
            font-size: clamp(0.95rem, 1.8vw, 1.15rem);
            color: var(--muted-color);
            margin: 1.75rem 0 2.5rem;
            max-width: 32rem;
            line-height: 1.6;
        }

        .error-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
        }

        .error-actions .btn-view-projects {
            cursor: pointer;
        }

        .error-actions .btn-view-projects .arrow-icon {
            transition: transform 0.3s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .error-actions .btn-view-projects:hover .arrow-icon {
            transform: translateX(-4px);
        }

        @media (max-width: 1024px) {
            .error-page {
                padding: 6.5rem 1.5rem 4rem;
            }
        }
    </style>
</head>

<body class="tech-editorial">
    <div class="crt" aria-hidden="true"></div>
    <div class="tv-glass" aria-hidden="true"></div>
    <div class="grain-overlay" aria-hidden="true"></div>
    <div class="custom-cursor" aria-hidden="true"></div>

    <!-- Corner Navigation -->
    <nav class="corner-nav" aria-label="Primary">
        <div class="nav-tl">
            <a href="/" class="logo-link" aria-label="Khaled Alsyoufi — home">
                <img src="/public/images/logo.webp" alt="Khaled Alsyoufi" class="main-logo" width="23" height="40">
            </a>
        </div>
        <div class="nav-tr">
            <span class="mono">&copy;KHALED ALSYOUFI<span class="accent">.</span></span>
        </div>
        <div class="nav-bl">
            <span class="mono vhs-deck">&#9654; ERROR <span class="vhs-sp">404</span></span>
            <span class="mono">STATUS: NOT FOUND</span>
            <span class="mono hud-clock" id="hud-clock">00:00:00</span>
        </div>
        <div class="nav-br">
            <ul class="nav-links mono">
                <li><a href="/">[ RETURN TO HOME ]</a></li>
            </ul>
        </div>
    </nav>

    <main class="error-page">
        <div class="error-badge mono accent">[ SYSTEM_FAULT // 404 ]</div>
        <h1 class="error-code">4<span class="accent">0</span>4</h1>
        <p class="error-desc">The requested transmission could not be found or has been moved to another frequency.</p>
        <div class="error-actions">
            <a href="/" class="btn-view-projects mono">
                <svg class="arrow-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                <span>RETURN TO HOME</span>
            </a>
        </div>
    </main>

    <script>
        // HUD Clock
        (function initClock() {
            var el = document.getElementById('hud-clock');
            if (!el) return;
            function tick() {
                var d = new Date();
                var pad = function (n) { return String(n).padStart(2, '0'); };
                el.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
            }
            tick();
            setInterval(tick, 1000);
        })();

        // Custom Cursor
        (function initCursor() {
            var cursor = document.querySelector('.custom-cursor');
            if (!cursor) return;
            var finePointer = window.matchMedia('(hover: hover) and (pointer: fine)');
            if (!finePointer.matches) {
                cursor.style.display = 'none';
                return;
            }
            document.body.classList.add('has-custom-cursor');
            document.addEventListener('mousemove', function (e) {
                cursor.style.left = e.clientX + 'px';
                cursor.style.top = e.clientY + 'px';
            });
            document.addEventListener('mouseleave', function () {
                cursor.style.opacity = '0';
            });
            document.addEventListener('mouseenter', function () {
                cursor.style.opacity = '';
            });
            document.addEventListener('mouseover', function (e) {
                if (e.target.closest('a, button')) {
                    cursor.classList.add('hover');
                }
            });
            document.addEventListener('mouseout', function (e) {
                if (e.target.closest('a, button')) {
                    cursor.classList.remove('hover');
                }
            });
        })();
    </script>
</body>

</html>
